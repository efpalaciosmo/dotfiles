<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- User defaults, not forced replacement of explicit app/document fonts.
       Keep normal fontconfig fallback for emoji and missing language glyphs.
       Proportional text (apps, browsers, Electron) uses Adwaita Sans; JetBrains
       stays for monospace and for the shell tools that name it explicitly. -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Adwaita Sans</family>
      <family>Cantarell</family>
    </prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Adwaita Sans</family>
      <family>Cantarell</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>JetBrains Mono</family>
    </prefer>
  </alias>
</fontconfig>
