# Panel compacto: superficie elevada, foco discreto y tipografia legible.
[main]
font=JetBrainsMono Nerd Font Mono:style=Medium:size=12
use-bold=no
icon-theme=Adwaita
icons-enabled=yes
terminal=kitty -e
placeholder=Buscar…
# Las comillas preservan el espacio despues del separador.
prompt="Aplicaciones  │  "
match-mode=fzf
sort-result=yes
anchor=center
width=36
lines=8
horizontal-pad=20
vertical-pad=14
inner-pad=10
line-height=25px
image-size-ratio=0
layer=overlay

[colors]
background=30283fff
text=f5effaff
prompt=d9b8ffff
placeholder=aa9bbcff
input=f5effaff
match=d9b8ffff
selection=49395cff
selection-text=f5effaff
selection-match=f6c28bff
border=665475ff

[border]
width=1
radius=14
selection-radius=7
