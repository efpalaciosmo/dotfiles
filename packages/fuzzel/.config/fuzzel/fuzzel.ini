# Adwaita dark popover, native UI type, and orange selection.
[main]
font=Adwaita Sans:size=12,JetBrainsMono Nerd Font:size=12
# Match GTK's logical font size; output scale still handles HiDPI monitors.
dpi-aware=no
use-bold=no
icon-theme=Adwaita
icons-enabled=yes
terminal=kitty -e
placeholder=Buscar…
# Las comillas preservan el espacio despues del separador.
prompt="Aplicaciones  │  "
match-mode=fzf
sort-result=yes
anchor=center
width=48
lines=8
horizontal-pad=20
vertical-pad=14
inner-pad=10
line-height=32px
image-size-ratio=0
layer=overlay

[colors]
background=36363aff
text=ffffffff
prompt=ff9c5bff
placeholder=9a9996ff
input=ffffffff
match=ff9c5bff
selection=ff7800ff
selection-text=1d1d20ff
selection-match=1d1d20ff
border=505055ff

[border]
width=1
radius=12
selection-radius=8
