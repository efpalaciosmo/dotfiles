# Adwaita dark popover, JetBrains type, and orange selection.
[main]
font=JetBrainsMono Nerd Font:size=14,JetBrains Mono:size=14
# Logical font size; output scale still handles HiDPI monitors.
dpi-aware=no
use-bold=no
icon-theme=Adwaita
icons-enabled=yes
terminal=ghostty -e
placeholder=Search…
# Quotes preserve the space after the separator.
prompt="Applications  │  "
match-mode=fzf
sort-result=yes
# Anchored near the top (not centered) so the prompt never jumps while results filter.
anchor=top
y-margin=220
width=56
lines=9
match-counter=yes
horizontal-pad=28
vertical-pad=22
inner-pad=16
line-height=40px
image-size-ratio=0
layer=overlay

[colors]
background=36363aff
text=ffffffff
prompt=ff9c5bff
placeholder=a8a7a4ff
input=ffffffff
match=ff9c5bff
selection=4b4b50ff
selection-text=ffffffff
selection-match=ff9c5bff
border=5e5e64ff
counter=a8a7a4ff

[border]
width=1
radius=16
selection-radius=10
