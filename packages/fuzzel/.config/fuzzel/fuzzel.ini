# Adwaita dark popover, JetBrains type, and orange selection.
[main]
font=JetBrainsMono Nerd Font:size=13,JetBrains Mono:size=13
# Logical font size; output scale still handles HiDPI monitors.
dpi-aware=no
use-bold=no
icon-theme=Adwaita
icons-enabled=yes
terminal=ghostty -e
placeholder=Search…
# Quotes preserve the space after the separator.
prompt="Applications  │  "
match-mode=fzf
sort-result=yes
anchor=center
width=52
lines=10
horizontal-pad=24
vertical-pad=18
inner-pad=12
line-height=36px
image-size-ratio=0
layer=overlay

[colors]
background=36363aff
text=ffffffff
prompt=ff9c5bff
placeholder=9a9996ff
input=ffffffff
match=ff9c5bff
selection=ff7800ff
selection-text=1d1d20ff
selection-match=1d1d20ff
border=505055ff

[border]
width=1
radius=12
selection-radius=8
