# Adwaita dark view, neutral chrome, and orange focus.
font_family Adwaita Mono
font_size 14.0
disable_ligatures never

background #1d1d20
foreground #ffffff
background_opacity 1.0
cursor #ff7800
cursor_text_color #1d1d20
cursor_shape beam
selection_background #ff7800
selection_foreground #1d1d20
url_color #81d0ff

window_padding_width 12
active_border_color #ff7800
inactive_border_color #45454a
bell_border_color #ed333b

tab_bar_style separator
tab_separator "  │  "
tab_bar_background #222226
active_tab_background #ff7800
active_tab_foreground #1d1d20
inactive_tab_background #222226
inactive_tab_foreground #c0bfbc

# GNOME palette for CLI output; bright colors stay readable on dark surfaces.
color0 #1d1d20
color1 #e01b24
color2 #33d17a
color3 #f6d32d
color4 #3584e4
color5 #9141ac
color6 #2190a4
color7 #deddda
color8 #77767b
color9 #f66151
color10 #8ff0a4
color11 #f9f06b
color12 #99c1f1
color13 #dc8add
color14 #7bdff4
color15 #ffffff
