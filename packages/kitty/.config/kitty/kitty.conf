# Adwaita's dark view for text, with a restrained blue-twilight chrome.
font_family JetBrainsMono Nerd Font Mono
font_size 14.0
disable_ligatures never

background #1d1d20
foreground #ffffff
background_opacity 1.0
cursor #62a0ea
cursor_text_color #1d1d20
cursor_shape beam
selection_background #2c426a
selection_foreground #ffffff
url_color #81d0ff

window_padding_width 12
active_border_color #62a0ea
inactive_border_color #5e5c64
bell_border_color #ed333b

tab_bar_style separator
tab_separator "  │  "
tab_bar_background #272a40
active_tab_background #1c71d8
active_tab_foreground #ffffff
inactive_tab_background #272a40
inactive_tab_foreground #c0bfbc

# GNOME palette for CLI output; bright colors stay readable on dark surfaces.
color0 #1d1d20
color1 #e01b24
color2 #33d17a
color3 #f6d32d
color4 #3584e4
color5 #9141ac
color6 #2190a4
color7 #deddda
color8 #77767b
color9 #f66151
color10 #8ff0a4
color11 #f9f06b
color12 #99c1f1
color13 #dc8add
color14 #7bdff4
color15 #ffffff
