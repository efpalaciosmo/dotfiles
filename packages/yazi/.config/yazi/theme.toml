# Adwaita Dark with the desktop's orange accent (matches Ghostty, Fuzzel, Waybar).
# surface #1d1d20, raised #36363a, selected row #4b4b50, line #45454a,
# accent #ff7800, text orange #ff9c5b, blue #99c1f1, green #8ff0a4, amber #ffc252, red #ff938c.

[mgr]
cwd = { fg = "#ff9c5b", bold = true }
hovered = { fg = "#ffffff", bg = "#4b4b50", bold = true }
preview_hovered = { bg = "#36363a" }
find_keyword = { fg = "#ffc252", bold = true, underline = true }
find_position = { fg = "#ff9c5b", bg = "#36363a", bold = true }
symlink_target = { fg = "#7bdff4", italic = true }
marker_copied = { fg = "#8ff0a4", bg = "#8ff0a4" }
marker_cut = { fg = "#ff938c", bg = "#ff938c" }
marker_marked = { fg = "#7bdff4", bg = "#7bdff4" }
marker_selected = { fg = "#ff7800", bg = "#ff7800" }
count_copied = { fg = "#1d1d20", bg = "#8ff0a4" }
count_cut = { fg = "#1d1d20", bg = "#ff938c" }
count_selected = { fg = "#1d1d20", bg = "#ff7800" }
border_symbol = "│"
border_style = { fg = "#45454a" }

[tabs]
active = { fg = "#1d1d20", bg = "#ff7800", bold = true }
inactive = { fg = "#c0bfbc", bg = "#36363a" }

[mode]
normal_main = { fg = "#1d1d20", bg = "#ff7800", bold = true }
normal_alt = { fg = "#ff9c5b", bg = "#36363a" }
select_main = { fg = "#1d1d20", bg = "#8ff0a4", bold = true }
select_alt = { fg = "#8ff0a4", bg = "#36363a" }
unset_main = { fg = "#1d1d20", bg = "#ff938c", bold = true }
unset_alt = { fg = "#ff938c", bg = "#36363a" }

[status]
overall = { bg = "#222226" }
perm_sep = { fg = "#45454a" }
perm_type = { fg = "#99c1f1" }
perm_read = { fg = "#ffc252" }
perm_write = { fg = "#ff938c" }
perm_exec = { fg = "#8ff0a4" }
progress_label = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#ff7800", bg = "#36363a" }
progress_error = { fg = "#ff938c", bg = "#36363a" }

[which]
cols = 3
mask = { bg = "#222226" }
cand = { fg = "#ff9c5b" }
rest = { fg = "#9a9996" }
desc = { fg = "#c0bfbc" }
separator = "  "
separator_style = { fg = "#45454a" }

[confirm]
border = { fg = "#ff7800" }
title = { fg = "#ff9c5b", bold = true }
content = { fg = "#ffffff" }
list = { fg = "#c0bfbc" }
btn_yes = { fg = "#1d1d20", bg = "#ff7800" }
btn_no = { fg = "#c0bfbc", bg = "#36363a" }

[spot]
border = { fg = "#ff7800" }
title = { fg = "#ff9c5b", bold = true }
tbl_col = { fg = "#99c1f1" }
tbl_cell = { fg = "#1d1d20", bg = "#ff7800" }

[notify]
title_info = { fg = "#99c1f1" }
title_warn = { fg = "#ffc252" }
title_error = { fg = "#ff938c" }

[pick]
border = { fg = "#ff7800" }
active = { fg = "#ffffff", bg = "#4b4b50", bold = true }
inactive = { fg = "#c0bfbc" }

[input]
border = { fg = "#ff7800" }
title = { fg = "#ff9c5b" }
value = { fg = "#ffffff" }
selected = { fg = "#1d1d20", bg = "#ff7800" }

[cmp]
border = { fg = "#ff7800" }
active = { fg = "#ffffff", bg = "#4b4b50", bold = true }
inactive = { fg = "#c0bfbc" }

[tasks]
border = { fg = "#ff7800" }
title = { fg = "#ff9c5b", bold = true }
hovered = { fg = "#ffffff", bg = "#4b4b50", bold = true }

[help]
on = { fg = "#ff9c5b" }
run = { fg = "#7bdff4" }
desc = { fg = "#c0bfbc" }
hovered = { fg = "#ffffff", bg = "#4b4b50", bold = true }
footer = { fg = "#c0bfbc", bg = "#36363a" }

[filetype]
rules = [
    { url = "*/", fg = "#99c1f1" },
    { url = "*", is = "exec", fg = "#8ff0a4" },
    { url = "*", is = "link", fg = "#7bdff4" },
    { url = "*", is = "orphan", fg = "#ff938c" },
    { url = "*", is = "dummy", fg = "#ff938c" },
    { mime = "image/*", fg = "#dc8add" },
    { mime = "{audio,video}/*", fg = "#ffc252" },
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ffbe6f" },
    { mime = "application/pdf", fg = "#ff938c" },
    { url = ".*", fg = "#9a9996" },
]

# File icons. yazi's built-in icon table colors every type from its own 221-color set, which
# ignores this palette, so icons are redefined here with the same glyphs. Color is semantic,
# like Waybar: blue code and folders, orange configuration, green scripts and executables,
# purple images, amber audio/video, gold archives, red PDF, quiet gray for lock/cache files.
# A name that is not listed falls back to the generic file/folder icon below.
[icon]
dirs = [
    # Folders: blue like the names; places that hold configuration are orange.
    { name = "Desktop", text = "\uf108", fg = "#99c1f1" },
