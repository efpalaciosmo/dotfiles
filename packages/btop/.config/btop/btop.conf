# Portable btop settings. Missing options use btop's defaults.
color_theme = "Default"
theme_background = true
truecolor = true
rounded_corners = true
terminal_sync = true
graph_symbol = "braille"
shown_boxes = "cpu mem net proc"
update_ms = 2000
proc_sorting = "cpu lazy"
proc_tree = false
proc_mem_bytes = true
show_gpu_info = "Auto"
check_temp = true
show_coretemp = true
show_disks = true
only_physical = true
show_io_stat = true
net_auto = true
show_battery = true
save_config_on_exit = false
log_level = "WARNING"
