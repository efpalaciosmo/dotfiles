---
- name: Check which Fedora packages are already installed
  ansible.builtin.command:
    argv: [rpm, -q, --whatprovides, --quiet, "{{ item }}"]
  loop: "{{ fedora_packages }}"
  register: fedora_package_checks
  changed_when: false
  failed_when: false
  check_mode: false

- name: Preview missing Fedora packages
  ansible.builtin.debug:
    msg: "Would install: {{ fedora_package_checks.results | selectattr('rc', 'ne', 0) | map(attribute='item') | join(', ') }}"
  when:
    - ansible_check_mode
    - fedora_package_checks.results | selectattr('rc', 'ne', 0) | list | length > 0
  changed_when: true

- name: Check whether sudo can install missing packages
  ansible.builtin.command:
    argv: [sudo, -n, 'true']
  register: fedora_sudo_check
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - not ansible_check_mode
    - ansible_facts.user_uid != 0
    - fedora_package_checks.results | selectattr('rc', 'ne', 0) | list | length > 0

- name: Require usable privilege escalation for DNF
  ansible.builtin.assert:
    that: fedora_sudo_check.rc == 0
    fail_msg: >-
      Missing Fedora packages require root, but sudo cannot elevate privileges here.
      Run make packages from a normal Fedora Distrobox terminal with working
      passwordless sudo (outside a no-new-privileges sandbox).
      {{ fedora_sudo_check.stderr | default('sudo is unavailable') }}
    quiet: true
  when:
    - not ansible_check_mode
    - ansible_facts.user_uid != 0
    - fedora_package_checks.results | selectattr('rc', 'ne', 0) | list | length > 0

- name: Install missing Fedora packages with dnf
  become: "{{ ansible_facts.user_uid != 0 }}"
  ansible.builtin.command:
    argv: "{{ ['dnf', 'install', '-y', '--setopt=install_weak_deps=False'] + (fedora_package_checks.results | selectattr('rc', 'ne', 0) | map(attribute='item') | list) }}"
  when:
    - not ansible_check_mode
    - fedora_package_checks.results | selectattr('rc', 'ne', 0) | list | length > 0
