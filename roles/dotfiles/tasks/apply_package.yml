---
# stow_pkg_dir = absolute path to package (e.g. .../packages/starship)
- name: Find files under package
  ansible.builtin.find:
    paths: "{{ stow_pkg_dir }}"
    recurse: true
    file_type: file
    hidden: true
  register: _dotfiles_pkg_files

- name: Filter ignored paths for Stow preflight
  ansible.builtin.set_fact:
    _leaves: >-
      {{
        _dotfiles_pkg_files.files
        | map(attribute='path')
        | reject('search', dotfiles_ignore_regex)
        | list
      }}

- name: Initialize package conflict state
  ansible.builtin.set_fact:
    _stow_package_has_conflicts: false

- name: Check each target for conflicts
  ansible.builtin.include_tasks: backup_conflict.yml
  loop: "{{ _leaves }}"
  loop_control:
    loop_var: _leaf

- name: Report conflicts during check mode
  ansible.builtin.debug:
    msg: >-
      {{ _stow_pkg_name }} has existing files that will be backed up before
      GNU Stow is run. Stow simulation is skipped for this package.
  when:
    - ansible_check_mode
    - _stow_package_has_conflicts | bool

- name: Run GNU Stow for package
  ansible.builtin.command:
    argv: >-
      {{
        [
          'stow',
          '--dir', dotfiles_packages_root,
          '--target', ansible_facts.env.HOME,
          '--restow',
          '--no-folding',
          '--verbose=1',
          '--ignore', dotfiles_ignore_regex
        ]
        + (['--simulate'] if ansible_check_mode else [])
        + [_stow_pkg_name]
      }}
  register: _stow_out
  check_mode: false
  when: not (ansible_check_mode and (_stow_package_has_conflicts | bool))
  changed_when: >-
    not ansible_check_mode
    and (
      (
        (_stow_out.stdout_lines + _stow_out.stderr_lines)
        | select('match', '^LINK:')
        | reject('search', 'reverts previous action')
        | list
        | length
      ) > 0
      or
      (
        (
          (_stow_out.stdout_lines + _stow_out.stderr_lines)
          | select('match', '^UNLINK:')
          | list
          | length
        )
        >
        (
          (_stow_out.stdout_lines + _stow_out.stderr_lines)
          | select('search', 'reverts previous action')
          | list
          | length
        )
      )
    )
