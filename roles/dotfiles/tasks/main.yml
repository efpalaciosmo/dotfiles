---
- name: Require GNU Stow
  ansible.builtin.command:
    argv:
      - stow
      - --version
  register: stow_version
  changed_when: false

- name: Require Stow package list
  ansible.builtin.assert:
    that:
      - stow_packages is defined
      - stow_packages | length > 0
    quiet: true

- name: Select Stow package names for this profile
  ansible.builtin.set_fact:
    _stow_names: "{{ stow_packages }}"

- name: Stat each Stow package directory
  ansible.builtin.stat:
    path: "{{ dotfiles_packages_root }}/{{ item }}"
  loop: "{{ _stow_names }}"
  register: stow_pkg_stat

- name: Require package dirs under dotfiles_packages_root
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - item.stat.isdir | default(false)
    fail_msg: >-
      Missing Stow package '{{ item.item }}' - expected directory
      {{ dotfiles_packages_root }}/{{ item.item }}
    quiet: true
  loop: "{{ stow_pkg_stat.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Apply each Stow package
  ansible.builtin.include_tasks: apply_package.yml
  loop: "{{ _stow_names }}"
  loop_control:
    loop_var: _stow_pkg_name
  vars:
    stow_pkg_dir: "{{ dotfiles_packages_root }}/{{ _stow_pkg_name }}"
