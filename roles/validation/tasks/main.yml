---
- name: Context summary
  ansible.builtin.debug:
    msg:
      - "=== dotfiles doctor ==="
      - "User={{ ansible_facts.user_id | default(ansible_facts.env.USER) }} HOME={{ ansible_facts.env.HOME }}"
      - "Distribution={{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}"

- name: Check required commands in one shell
  ansible.builtin.shell: |
    missing=0
    if command -v fnm >/dev/null 2>&1; then
      eval "$(fnm env --shell bash)"
      fnm use {{ fnm_node_version | quote }} >/dev/null 2>&1 || true
    fi
    for name in $DOTFILES_REQUIRED_COMMANDS; do
      if path=$(command -v "$name" 2>/dev/null); then
        printf 'OK   %-20s %s\n' "$name" "$path"
      else
        printf 'MISS %s\n' "$name"
        missing=1
      fi
    done
    exit "$missing"
  args:
    executable: /bin/bash
  environment:
    PATH: "{{ ansible_facts.env.HOME }}/.local/bin:{{ ansible_facts.env.PATH | default('') }}"
    DOTFILES_REQUIRED_COMMANDS: "{{ expected_commands | join(' ') }}"
  register: doctor_required_commands
  changed_when: false
  failed_when: false

- name: Show required command status
  ansible.builtin.debug:
    var: doctor_required_commands.stdout_lines

- name: Check TeX resources used by the template and presentations
  ansible.builtin.command:
    argv: [kpsewhich, "{{ item }}"]
  loop:
    - article.cls
    - beamer.cls
    - amsthm.sty
    - mathtools.sty
    - lmodern.sty
    - eepic.sty
    - setspace.sty
    - threeparttable.sty
    - csquotes.sty
    - biblatex.sty
  register: doctor_tex_resources
  changed_when: false
  failed_when: false

- name: Compile the managed LaTeX template
  block:
    - name: Create temporary LaTeX output directory
      ansible.builtin.tempfile:
        state: directory
        suffix: -dotfiles-latex
      register: doctor_latex_dir

    - name: Build the LaTeX template with latexmk
      ansible.builtin.command:
        argv:
          - latexmk
          - -pdf
          - -halt-on-error
          - -interaction=nonstopmode
          - "-output-directory={{ doctor_latex_dir.path }}"
          - "{{ dotfiles_packages_root }}/nvim-vm/.config/nvim/templates/latex.tex"
      register: doctor_latex_build
      changed_when: false
      failed_when: false
  always:
    - name: Remove temporary LaTeX output
      ansible.builtin.file:
        path: "{{ doctor_latex_dir.path }}"
        state: absent
      when: doctor_latex_dir.path is defined

- name: Check optional commands in one shell
  ansible.builtin.shell: |
    for name in $DOTFILES_OPTIONAL_COMMANDS; do
      if path=$(command -v "$name" 2>/dev/null); then
        printf 'OK   %-20s %s\n' "$name" "$path"
      else
        printf 'INFO %-20s manually managed\n' "$name"
      fi
    done
  args:
    executable: /bin/bash
  environment:
    PATH: "{{ ansible_facts.env.HOME }}/.local/bin:{{ ansible_facts.env.PATH | default('') }}"
    DOTFILES_OPTIONAL_COMMANDS: "{{ optional_commands | join(' ') }}"
  register: doctor_optional_commands
  changed_when: false

- name: Show optional command status
  ansible.builtin.debug:
    var: doctor_optional_commands.stdout_lines

- name: Validate managed dotfile links
  ansible.builtin.shell: |
    set -u
    missing=0
    root="$DOTFILES_PACKAGES_ROOT"
    for package in $DOTFILES_STOW_PACKAGES; do
      prefix="$root/$package/"
      while IFS= read -r -d '' source; do
        relative="${source#"$prefix"}"
        case "$relative" in
          README|README.md|*/README|*/README.md) continue ;;
        esac
        target="$HOME/$relative"
        if [[ -L "$target" && -e "$target" ]]; then
          continue
        fi
        printf 'MISS %s\n' "$target"
        missing=1
      done < <(find "$root/$package" -type f -print0)
    done
    exit "$missing"
  args:
    executable: /bin/bash
  environment:
    DOTFILES_PACKAGES_ROOT: "{{ dotfiles_packages_root }}"
    DOTFILES_STOW_PACKAGES: "{{ stow_packages | join(' ') }}"
  register: doctor_links
  changed_when: false
  failed_when: false

- name: Show dotfile link status
  ansible.builtin.debug:
    msg: "{{ doctor_links.stdout_lines if doctor_links.stdout_lines else ['All managed links are valid'] }}"

- name: Require core commands and valid links
  ansible.builtin.assert:
    that:
      - doctor_required_commands.rc == 0
      - doctor_tex_resources.results | selectattr('rc', 'ne', 0) | list | length == 0
      - doctor_latex_build.rc == 0
      - doctor_links.rc == 0
    fail_msg: >-
      Dotfiles doctor failed:
       {{ ((doctor_required_commands.stdout_lines + doctor_links.stdout_lines)
           | select('match', '^MISS ') | join(', '))
          ~ (', missing TeX resources: ' ~ (doctor_tex_resources.results
             | selectattr('rc', 'ne', 0) | map(attribute='item') | join(', '))
             if doctor_tex_resources.results | selectattr('rc', 'ne', 0) | list | length > 0 else '')
          ~ (', LaTeX template failed to compile: ' ~ (doctor_latex_build.stdout_lines[-15:] | join(' '))
             if doctor_latex_build.rc != 0 else '') }}
    quiet: true
