---
- name: Configure CachyOS laptop
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    dotfile_packages:
      - git
      - shell-container
      - starship
      - vi
      - kitty
      - niri
      - waybar
      - mako
      - fuzzel
      - desktop
    cachyos_packages: >-
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/system-packages/cachyos.txt').splitlines()
         | reject('match', '^\s*(#|$)') | list }}

  pre_tasks:
    - name: Refuse to run the playbook as root
      ansible.builtin.assert:
        that: ansible_facts['user_uid'] | int != 0
        fail_msg: Run ansible-playbook as your normal user, not with sudo.
      tags: always

    - name: Read the installed operating system
      ansible.builtin.slurp:
        src: /etc/os-release
      register: installed_os
      tags: [packages, services, libvirt]

    - name: Refuse system package installation outside CachyOS
      ansible.builtin.assert:
        that: (installed_os.content | b64decode) is search('(?m)^ID="?cachyos"?$')
        fail_msg: Package installation is only supported on CachyOS; use --tags local for fonts and links.
      tags: [packages, services, libvirt]

    - name: Validate the package manifest before using sudo
      ansible.builtin.assert:
        that:
          - cachyos_packages | length > 0
          - cachyos_packages | reject('match', '^[a-z0-9][a-z0-9@._+-]*$') | list | length == 0
          - cachyos_packages | unique | list | length == cachyos_packages | length
        fail_msg: system-packages/cachyos.txt has an invalid or duplicate package name.
      tags: packages

  tasks:
    # Fail on repository/configuration problems before making system changes.
    - name: Run static repository checks
      ansible.builtin.command:
        argv: [make, -C, "{{ playbook_dir }}", check]
      environment:
        ANSIBLE_VENV: "{{ ansible_playbook_python | dirname | dirname }}"
      changed_when: false
      when: not ansible_check_mode
      tags: [always, check, local]

    # Pacman does not support partial upgrades. Complete -Syu first; the module
    # intentionally makes `upgrade` and `name` mutually exclusive.
    - name: Upgrade the complete CachyOS system
      community.general.pacman:
        update_cache: true
        upgrade: true
      become: true
      when: not ansible_check_mode
      tags: packages

    - name: Install declared CachyOS packages
      community.general.pacman:
        name: "{{ item }}"
        state: present
      loop: "{{ cachyos_packages }}"
      loop_control:
        index_var: package_index
        label: "{{ package_index + 1 }}/{{ cachyos_packages | length }} {{ item }}"
      become: true
      when: not ansible_check_mode
      tags: packages

    - name: Configure the user Flathub remote
      ansible.builtin.import_tasks: tasks/flathub-user.yml
      when: not ansible_check_mode
      tags: packages

    - name: Read system Flatpak remotes
      ansible.builtin.command:
        argv: [flatpak, remotes, --system, --columns=name]
      register: system_remotes
      changed_when: false
      when: not ansible_check_mode
      tags: packages

    # Without --force, Flatpak refuses removal if installed system refs use it.
    - name: Remove the system Flathub remote
      ansible.builtin.command:
        argv: [flatpak, remote-delete, --system, flathub]
      become: true
      when:
        - not ansible_check_mode
        - "'flathub' in system_remotes.stdout_lines"
      tags: packages

    - name: Configure required system and user services
      ansible.builtin.import_tasks: tasks/services.yml
      when: not ansible_check_mode
      tags: [packages, services]

    - name: Install user-local fonts
      ansible.builtin.command:
        argv:
          - "{{ playbook_dir }}/scripts/install-fonts.sh"
      when: not ansible_check_mode
      tags: [fonts, local]

    # The existing helper backs up conflicting targets before calling Stow.
    - name: Link dotfiles with safe conflict backups
      ansible.builtin.command:
        argv: "{{ [playbook_dir ~ '/scripts/apply-dotfiles.sh'] + dotfile_packages }}"
      when: not ansible_check_mode
      tags: [dotfiles, local]
