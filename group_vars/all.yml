fnm_version: v1.38.1
fnm_node_version: "24"
fnm_cache_dir: "{{ ansible_facts.env.XDG_CACHE_HOME | default(ansible_facts.env.HOME + '/.cache') }}/dotfiles/fnm/{{ fnm_version }}"
fnm_archives:
  x86_64: fnm-linux.zip
  aarch64: fnm-arm64.zip
fnm_checksums:
  x86_64: sha256:b69e5c9a05c1e17e4a7de9a17df14ba430d049f2591af791a6f850a170296069
  aarch64: sha256:69feda9455931c26c84be9f95f5e6f69e8b64686e68069fab7cfc34756cd2944

rustup_version: 1.29.0
rustup_default_toolchain: stable
rustup_components:
  - rustfmt
  - clippy
  - rust-analyzer
cargo_home: "{{ ansible_facts.env.CARGO_HOME | default(ansible_facts.env.HOME + '/.cargo') }}"
rustup_home: "{{ ansible_facts.env.RUSTUP_HOME | default(ansible_facts.env.HOME + '/.rustup') }}"
rustup_installer_path: "{{ ansible_facts.env.HOME }}/.cache/dotfiles/rustup-init-{{ rustup_version }}"
rustup_targets:
  x86_64: x86_64-unknown-linux-gnu
  aarch64: aarch64-unknown-linux-gnu
rustup_checksums:
  x86_64: sha256:4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10
  aarch64: sha256:9732d6c5e2a098d3521fca8145d826ae0aaa067ef2385ead08e6feac88fa5792

nerd_fonts_version: v3.4.0
nerd_fonts_base_url: "https://github.com/ryanoasis/nerd-fonts/releases/download/{{ nerd_fonts_version }}"
nerd_fonts_list:
  - archive: IBMPlexMono.tar.xz
    subdir: IBMPlexMono
    checksum: sha256:95e6ecaa5dfb9a96f27a6b6edc7be396fb6df30bc311a6f7e15cad56a30051c2
  - archive: JetBrainsMono.tar.xz
    subdir: JetBrainsMono
    checksum: sha256:ef552a3e638f25125c6ad4c51176a6adcdce295ab1d2ffacf0db060caf8c1582
  - archive: Inter-4.1.zip
    subdir: Inter
    version: v4.1
    url: https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
    checksum: sha256:9883fdd4a49d4fb66bd8177ba6625ef9a64aa45899767dde3d36aa425756b11e
nerd_fonts_user_fonts_dir: "{{ ansible_facts.env.HOME }}/.local/share/fonts"
nerd_fonts_root: "{{ nerd_fonts_user_fonts_dir }}/dotfiles"
nerd_fonts_cache_dir: "{{ ansible_facts.env.XDG_CACHE_HOME | default(ansible_facts.env.HOME + '/.cache') }}/dotfiles/fonts/{{ nerd_fonts_version }}"

dotfiles_ignore_regex: '(^|/)(\.git|\.gitkeep|\.DS_Store|README\.md|README|node_modules|auth\.json|.*\.db(-.*)?|.*\.sqlite(-.*)?|.*\.log|.*\.backup.*|package-lock\.json)$'
