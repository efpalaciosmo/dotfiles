---
dotfiles_packages_root: "{{ playbook_dir }}/packages"

stow_packages:
  - git
  - shell-container
  - starship
  - nvim-vm
  - btop
  - tmux
  - opencode
  - xdg
  - vscode

# Fedora packages for Python/uv, JS/TS (Node via fnm), C, LaTeX, and shell tools.
# GNU Stow and optional commands are installed separately by the user.
fedora_packages:
  - git
  - gh
  - curl
  - make
  - unzip
  - xz
  - 7zip
  - neovim
  - bash-completion
  - zsh
  - zsh-autosuggestions
  - zsh-syntax-highlighting
  - jq
  - cmake
  - ninja-build
  - pkgconf-pkg-config
  - gcc
  - glibc-devel
  - clang-tools-extra
  - gdb
  - tree
  - fd-find
  - ripgrep
  - fzf
  - bat
  - btop
  - tmux
  - zoxide
  - duf
  - ncdu
  - fastfetch
  - ncurses-term
  - ShellCheck
  - uv
  # Thesis writing and Beamer presentations without the full TeX Live collections.
  - texlive-scheme-basic
  - texlive-beamer
  - texlive-amsmath
  - texlive-amscls
  - texlive-amsfonts
  - texlive-mathtools
  - texlive-geometry
  - texlive-microtype
  - texlive-lm
  - texlive-biblatex
  - biber
  - latexmk
  - texlive-xetex
  - texlive-luatex
  - fontconfig

expected_commands:
  - bash
  - zsh
  - git
  - gh
  - make
  - python3
  - curl
  - unzip
  - xz
  - 7z
  - jq
  - cmake
  - ctest
  - ninja
  - pkg-config
  - gcc
  - clangd
  - clang-format
  - clang-tidy
  - gdb
  - tree
  - fd
  - rg
  - fzf
  - bat
  - btop
  - tmux
  - zoxide
  - duf
  - ncdu
  - fastfetch
  - infocmp
  - tic
  - shellcheck
  - uv
  - fnm
  - node
  - pnpm
  - pdflatex
  - xelatex
  - lualatex
  - latexmk
  - bibtex
  - biber
  - kpsewhich

optional_commands:
  - nvim
  - starship
  - lazygit
  - yazi
  - resvg
  - opencode
  - harlequin

fnm_version: v1.38.1
fnm_node_version: "24"
fnm_cache_dir: "{{ ansible_facts.env.XDG_CACHE_HOME | default(ansible_facts.env.HOME + '/.cache') }}/dotfiles/fnm/{{ fnm_version }}"
fnm_archives:
  x86_64: fnm-linux.zip
  aarch64: fnm-arm64.zip
fnm_checksums:
  x86_64: sha256:b69e5c9a05c1e17e4a7de9a17df14ba430d049f2591af791a6f850a170296069
  aarch64: sha256:69feda9455931c26c84be9f95f5e6f69e8b64686e68069fab7cfc34756cd2944

pnpm_version: '10'

nerd_fonts_version: v3.4.0
nerd_fonts_base_url: "https://github.com/ryanoasis/nerd-fonts/releases/download/{{ nerd_fonts_version }}"
nerd_fonts_list:
  - archive: IBMPlexMono.tar.xz
    subdir: IBMPlexMono
    checksum: sha256:95e6ecaa5dfb9a96f27a6b6edc7be396fb6df30bc311a6f7e15cad56a30051c2
  - archive: JetBrainsMono.tar.xz
    subdir: JetBrainsMono
    checksum: sha256:ef552a3e638f25125c6ad4c51176a6adcdce295ab1d2ffacf0db060caf8c1582
  - archive: Inter-4.1.zip
    subdir: Inter
    version: v4.1
    url: https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
    checksum: sha256:9883fdd4a49d4fb66bd8177ba6625ef9a64aa45899767dde3d36aa425756b11e
nerd_fonts_user_fonts_dir: "{{ ansible_facts.env.HOME }}/.local/share/fonts"
nerd_fonts_root: "{{ nerd_fonts_user_fonts_dir }}/dotfiles"
nerd_fonts_cache_dir: "{{ ansible_facts.env.XDG_CACHE_HOME | default(ansible_facts.env.HOME + '/.cache') }}/dotfiles/fonts/{{ nerd_fonts_version }}"

dotfiles_ignore_regex: '(^|/)(\.git|\.gitkeep|\.DS_Store|README\.md|README|node_modules|auth\.json|.*\.db(-.*)?|.*\.sqlite(-.*)?|.*\.log|.*\.backup.*|package-lock\.json)$'
