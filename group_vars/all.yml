---
dotfiles_packages_root: "{{ playbook_dir }}/packages"

stown_packages:
  - git
  - shell-container
  - starship
  - nvim-vm
  - ghostty
  - niri
  - waybar
  - mako
  - rofi

homebrew_commands:
  - brew
  - bash
  - zsh
  - git
  - gh
  - make
  - cmake
  - ninja
  - pkgconf
  - python3
  - node
  - curl
  - wget
  - unzip
  - xz
  - 7zz
  - jq
  - tree
  - fd
  - rg
  - fzf
  - bat
  - btop
  - duf
  - ncdu
  - tmux
  - zoxide
  - fastfetch
  - lazygit
  - lazydocker
  - yazi
  - resvg
  - shellcheck
  - shfmt
  - nvim
  - tree-sitter
  - lua
  - stylua
  - uv
  - pnpm
  - cargo
  - rustc
  - zig
  - clang
  - starship
  - stow
  - pdftotext
  - magick
  - ffmpeg
  - pdflatex
  - latexmk
  - biber
  - gawk
  - gfind
  - ggrep
  - gsed
  - gtar

# Session components are installed manually from Fedora. They are deliberately
# absent from Brewfile, but doctor still verifies the complete desktop runtime.
fedora_session_commands:
  - niri
  - waybar
  - rofi
  - ghostty
  - mako
  - swaybg
  - swaylock
  - wl-copy
  - wl-paste
  - cliphist
  - playerctl
  - brightnessctl
  - notify-send
  - wpctl
  - nmcli
  - ip
  - cal
  - lsblk
  - systemctl
  - loginctl
  - dbus-update-activation-environment

pnpm_home: "{{ ansible_facts.env.PNPM_HOME | default(ansible_facts.env.HOME + '/.local/share/pnpm') }}"
node_user_tools_packages:
  - typescript

nerd_fonts_version: v3.4.0
nerd_fonts_base_url: "https://github.com/ryanoasis/nerd-fonts/releases/download/{{ nerd_fonts_version }}"
nerd_fonts_list:
  - archive: IBMPlexMono.tar.xz
    subdir: IBMPlexMono
  - archive: JetBrainsMono.tar.xz
    subdir: JetBrainsMono
  - archive: Inter-4.1.zip
    subdir: Inter
    version: v4.1
    url: https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
nerd_fonts_user_fonts_dir: "{{ ansible_facts.env.HOME }}/.local/share/fonts"
nerd_fonts_root: "{{ nerd_fonts_user_fonts_dir }}/nerd-fonts"
nerd_fonts_cache_dir: "{{ ansible_facts.env.XDG_CACHE_HOME | default(ansible_facts.env.HOME + '/.cache') }}/dotfiles/nerd-fonts/{{ nerd_fonts_version }}"
homebrew_prefix: "{{ lookup('env', 'HOMEBREW_PREFIX') | default('/home/linuxbrew/.linuxbrew', true) }}"
homebrew_gnu_tar_path: "{{ homebrew_prefix }}/opt/gnu-tar/libexec/gnubin"

zsh_dir: "{{ ansible_facts.env.ZSH | default(ansible_facts.env.HOME + '/.oh-my-zsh') }}"
zsh_custom: "{{ ansible_facts.env.ZSH_CUSTOM | default(zsh_dir + '/custom') }}"

cargo_home: "{{ ansible_facts.env.CARGO_HOME | default(ansible_facts.env.HOME + '/.cargo') }}"

dotfiles_ignore_regex: '(^|/)(\.git|\.gitkeep|\.DS_Store|README\.md|README|.*\.md\.template|templates/.*\.(aux|fdb_latexmk|fls|synctex\.gz|pdf))$'
