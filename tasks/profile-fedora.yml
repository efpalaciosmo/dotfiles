---
- name: Read Fedora edition metadata
  ansible.builtin.set_fact:
    fedora_os_release: "{{ lookup('ansible.builtin.file', '/etc/os-release') }}"
  tags: [always]

- name: Require Fedora Workstation 44
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Fedora"
      - ansible_facts.distribution_major_version == "44"
      - fedora_os_release is search('(?m)^VARIANT_ID=workstation$')
    fail_msg: "This dotfiles automation requires Fedora Workstation 44."
    quiet: true
  tags: [always]

- name: Common setup
  ansible.builtin.import_role:
    name: common
  tags: [always, common]

- name: Fedora packages
  ansible.builtin.import_role:
    name: fedora_packages
  tags: [packages]

- name: Fast Node Manager
  ansible.builtin.import_role:
    name: fnm
  tags: [fnm]

- name: Nerd Fonts
  ansible.builtin.import_role:
    name: fonts
  tags: [fonts]

- name: Apply dotfiles with GNU Stow
  ansible.builtin.import_role:
    name: dotfiles
  tags: [dotfiles]
